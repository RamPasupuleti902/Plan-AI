<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Manager &amp; Website Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Left: admin editor (admin look — small Poppins, red buttons).
   Right: the public website (site look — Outfit, blue). One data source feeds both. */
:root{
  --bg:#eef1f5; --panel:#fff; --ink:#1f2430; --ink-2:#4b5263; --muted:#8a90a0; --line:#e3e6ec;
  --red:#e3212b; --red-2:#c41a23; --red-soft:#fdecec;
  --blue:#1f5fe0; --blue-2:#1a4fbf; --violet:#7b5cf0; --blue-soft:#eef3ff; --chip:#eef1f7;
  --t3:#16a34a; --t2:#f59e0b; --t1:#ef4444; --ok:#16803c; --ok-soft:#e3f5e9;
  --fa:"Poppins","Segoe UI",system-ui,sans-serif; --fw:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--fa)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;font-weight:600}
.top .sub{color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:16px;padding:16px;max-width:1700px;margin:0 auto;align-items:start}
@media (max-width:1150px){.layout{grid-template-columns:minmax(0,1fr)}}
.pane-title{font:600 11px/1 var(--fa);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.pane-title .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.pane-title .dot.b{background:var(--blue)}

/* ---------- ADMIN ---------- */
.admin{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px;min-width:0}
.plist{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font-size:12px;text-align:left;max-width:100%}
.pbtn small{display:block;color:var(--muted);font-size:10.5px}
.pbtn.on{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.pbtn.new{border-style:dashed;color:var(--ink-2)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.f{display:grid;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11px;color:var(--ink-2)}
.f label em{font-style:normal;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:#fff;min-width:0;width:100%}
.f input:focus,.f select:focus{border-color:var(--blue);outline:none}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:7px 6px;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--red-soft);color:var(--red);font-weight:600}
.tiers{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;background:#fafbfc}
.tiers h3{margin:0;font-size:12px;font-weight:600}
.trow{display:grid;grid-template-columns:auto auto 64px auto minmax(0,auto);gap:6px;align-items:center;font-size:12px}
.trow input{border:1px solid var(--line);border-radius:4px;padding:5px 7px;width:100%}
.trow .sw{width:10px;height:10px;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:6px;border:1px dashed var(--line);border-radius:6px;min-height:30px}
.chip{background:var(--chip);border-radius:999px;padding:2px 3px 2px 9px;font-size:11.5px;display:inline-flex;align-items:center;gap:3px}
.chip button{border:0;background:none;width:17px;height:17px;border-radius:50%;color:var(--muted)}
.cpick{display:flex;gap:6px;flex-wrap:wrap}
.cpick input{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.cpick select{border:1px solid var(--line);border-radius:4px;padding:7px;background:#fff}
.btn{border:0;border-radius:4px;padding:9px 16px;font-weight:600;background:var(--red);color:#fff;font-size:12.5px}
.btn:hover{background:var(--red-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dirty{font-size:12px;color:var(--red);font-weight:600}
.saved{font-size:12px;color:var(--ok);font-weight:600}
details.ai{border:1px solid var(--line);border-radius:6px}
details.ai summary{cursor:pointer;padding:8px 10px;font-weight:600;font-size:12px}
details.ai .in{padding:0 10px 10px;font-size:12px}
.ai-box p{margin:0 0 3px;font-weight:600}.ai-box ul{margin:0 0 8px;padding-left:18px}

/* ---------- WEBSITE ---------- */
.site{background:#f5f8fc;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:var(--fw);font-size:15px;min-width:0}
.browser{display:flex;align-items:center;gap:8px;background:#e6e9ef;padding:8px 12px;font:12px var(--fa);color:var(--ink-2)}
.browser i{width:10px;height:10px;border-radius:50%;background:#c9ced8;display:inline-block}
.browser .url{flex:1;background:#fff;border-radius:6px;padding:4px 10px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.snav{background:#fff;display:flex;align-items:center;gap:22px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.slogo{font-weight:800;font-size:24px;letter-spacing:.12em}
.snav a{color:var(--ink-2);text-decoration:none;font-size:15px}
.snav a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.sbody{padding:18px 20px 26px;display:grid;gap:16px}
.stitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stitle h2{margin:0;font-size:24px;font-weight:700}
.stitle span{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pc{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:40px 20px 18px;display:grid;gap:4px;text-align:left}
.pc:hover{border-color:#bfd0f5}
.pc.sel{border-color:var(--blue);box-shadow:0 0 0 3px #dbe6ff}
.pc.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 4px #fde68a}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pc.flash{animation:none}}
.pill{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;font-weight:700;font-size:12px;padding:5px 12px;border-radius:7px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.pc .nm{font-size:13px;color:var(--muted)}
.gb{font-size:24px;font-weight:700}
.gb small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:2px}
.days{color:var(--ink-2)}
.price{font-size:22px;font-weight:700}
.price small{font-size:16px;color:var(--ink-2);font-weight:600;margin-left:4px}
.dp{display:inline-block;font-size:11px;font-weight:700;background:#fff7e6;color:#b45309;border-radius:6px;padding:2px 7px;margin-top:2px;justify-self:start}
.vd{color:var(--blue);font-size:15px;margin-top:6px}

.detail{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;gap:16px}
.dhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.dhead h3{margin:0;font-size:22px}
.dhead .meta{color:var(--ink-2);margin-top:2px}
.dhead .pr{font-size:28px;font-weight:700;text-align:right}
.dhead .pr small{font-size:16px;color:var(--ink-2)}
.buy{border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;padding:11px 22px;font-size:15px;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--blue-soft);color:#2a3f8f;border-radius:8px;padding:6px 10px;font-size:13px}
.fact b{font-weight:600}
.info p{margin:0 0 4px;font-weight:700}
.info ul{margin:0 0 12px;padding-left:20px}
.info li{margin:3px 0}

/* speed tiers visual */
.speed{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.speed h4{margin:0;font-size:15px}
.speed .note{font-size:13px;color:var(--muted)}
.sbar{display:flex;height:34px;border-radius:9px;overflow:hidden}
.sbar div{display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.sticks{position:relative;height:18px;font-size:12px;color:var(--muted)}
.sticks span{position:absolute;transform:translateX(-50%)}
.slegend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:620px){.slegend{grid-template-columns:1fr}}
.slegend div{border-radius:10px;padding:8px 10px;background:#f7f8fb;font-size:13px}
.slegend b{display:block;font-size:17px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-weight:500;z-index:9}
</style>
</head>
<body>
<div class="top">
  <h1>Plan manager → website</h1>
  <span class="sub">Edit a plan on the left and click Save. The website on the right updates from the same data.</span>
</div>

<div class="layout">
  <!-- =================== ADMIN =================== -->
  <section aria-label="Admin plan editor">
    <div class="pane-title"><span class="dot"></span>Admin · Update Plan</div>
    <div class="admin">
      <div class="plist" id="plist"></div>

      <div class="fields">
        <div class="f full"><label for="name">Plan name</label><input id="name"></div>
        <div class="f"><label for="vendor">Supplier / vendor</label>
          <select id="vendor"><option value="telco">Telco Vision (TEL VSN)</option><option value="rombty">Rombty</option></select></div>
        <div class="f"><label for="apn">APN <em id="apnHint"></em></label><input id="apn"></div>
        <div class="f"><label for="operator">Operator Name 1</label><input id="operator"></div>
        <div class="f"><label for="region">Region</label>
          <select id="region"><option>Asia-Pacific</option><option>Europe</option><option>Middle East</option><option>Africa</option><option>North America</option><option>South Latin America</option><option>Eurasia</option><option>Global</option></select></div>
        <div class="f full"><label>Plan type</label>
          <div class="seg" id="typeSeg"><button type="button" data-t="unlimited">Unlimited</button><button type="button" data-t="fixed">Fixed GB</button><button type="button" data-t="daypass">Day Pass</button></div></div>
        <div class="f" id="gbWrap"><label for="gb" id="gbLabel">Data (GB)</label><input id="gb" type="number" min="0.1" step="0.1"></div>
        <div class="f"><label for="days">Validity (days)</label><input id="days" type="number" min="1"></div>
        <div class="f"><label for="price">Selling price (USD)</label><input id="price" type="number" min="0" step="0.01"></div>
        <div class="f"><label for="vStart">Validity starts</label>
          <select id="vStart"><option value="first">From first network connection</option><option value="install">From eSIM installation</option></select></div>
        <div class="f"><label>Hotspot</label><div class="seg" id="hsSeg"><button type="button" data-v="1">Yes</button><button type="button" data-v="0">No</button></div></div>
        <div class="f"><label>canTopUp</label><div class="seg" id="tuSeg"><button type="button" data-v="1">Yes</button><button type="button" data-v="0">No</button></div></div>
      </div>

      <div class="tiers" id="tiersBox">
        <h3>Day Pass speed steps <span style="font-weight:400;color:var(--muted)">(share of the daily data used)</span></h3>
        <div id="tierRows"></div>
        <button type="button" class="btn ghost" id="tierReset" style="justify-self:start;padding:5px 10px">Reset to 60% · 80% · 100% → 3 · 2 · 1 Mbps</button>
      </div>

      <div class="f full"><label for="cInput">Map Country · supported countries</label>
        <div class="cpick"><input id="cInput" list="cList" placeholder="Type a country + Enter, or paste a comma list"><datalist id="cList"></datalist>
          <select id="cPreset" aria-label="Load a country set"><option value="">Load a set…</option></select></div>
        <div class="chips" id="chips"></div></div>

      <div class="actions">
        <button type="button" class="btn" id="save">Save plan → website</button>
        <button type="button" class="btn ghost" id="dup">Duplicate</button>
        <button type="button" class="btn ghost" id="del">Delete</button>
        <span id="dirty"></span>
      </div>

      <details class="ai"><summary>Additional Information (auto-generated)</summary><div class="in ai-box" id="aiAdmin"></div></details>
    </div>
  </section>

  <!-- =================== WEBSITE =================== -->
  <section aria-label="Website preview">
    <div class="pane-title"><span class="dot b"></span>Website · what customers see</div>
    <div class="site">
      <div class="browser"><i></i><i></i><i></i><span class="url" id="url"></span></div>
      <div class="snav"><span class="slogo">eSIM</span><a href="#" onclick="return false">For Businesses</a><a href="#" onclick="return false">Blogs</a><a href="#" class="on" onclick="return false">eSIM</a><a href="#" onclick="return false">Help</a></div>
      <div class="sbody">
        <div class="stitle"><h2 id="sTitle"></h2><span id="sSub"></span></div>
        <div class="cards" id="cards"></div>
        <div class="detail" id="detail"></div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + (+n || 0).toFixed(2);
const clone = o => JSON.parse(JSON.stringify(o));

/* ================= VENDORS: APN + template ================= */
const VENDORS = {
  telco: { name: 'Telco Vision', apn: 'plus',
    template: `# Package Details:
- {{data}}
[daypass]- {{speedTiers}}
- Operates on {{network}}
[hotspot]- Hotspot supports
- Validity starts {{validityStart}}
[topup]- Top up available
- APN - {{apn}}
- 24/7 customer support

# Supported Countries:
- {{countries}}` },
  rombty: { name: 'Rombty', apn: 'internet',
    template: `# Package Details:
- {{data}}
[daypass]- {{speedTiers}}
- Network: {{network}}
- Valid for {{validity}}, starting {{validityStart}}
[hotspot]- Hotspot / tethering allowed
[topup]- Top up anytime from your account
- APN: {{apn}}
- 24/7 customer support

# Coverage ({{countryCount}} countries):
- {{countries}}` }
};
const DEFAULT_TIERS = [{ upTo: 60, mbps: 3 }, { upTo: 80, mbps: 2 }, { upTo: 100, mbps: 1 }];
const TIER_COLORS = ['var(--t3)', 'var(--t2)', 'var(--t1)'];

const APAC = ['Bangladesh', 'China', 'India', 'Indonesia', 'Japan', 'Kazakhstan', 'Kyrgyzstan', 'Malaysia', 'Nepal', 'Philippines', 'Singapore', 'South Korea', 'Taiwan', 'Thailand', 'Uzbekistan'];
const SETS = { 'Asia-Pacific (15)': APAC, 'China · Korea · Japan': ['China', 'South Korea', 'Japan'], 'Nordic Summer': ['Denmark', 'Finland', 'Iceland', 'Norway', 'Sweden'], 'Eurasia': ['Armenia', 'Azerbaijan', 'Georgia', 'Kazakhstan', 'Turkey'], 'Middle East': ['Cyprus', 'Egypt', 'Israel', 'Kuwait', 'Qatar', 'Saudi Arabia', 'UAE'] };
const ALL = [...new Set(Object.values(SETS).flat().concat(['Australia', 'France', 'Germany', 'Hong Kong', 'Italy', 'Macau', 'Spain', 'United Kingdom', 'USA', 'Vietnam', 'Cambodia', 'Sri Lanka']))].sort();

/* ================= SAMPLE PLANS (website data) ================= */
const SAMPLE = [
  { id: 1, name: 'APAC Unlimited 3 Days', vendor: 'telco', apn: 'plus', operator: 'Multi - Networks', region: 'Asia-Pacific', type: 'unlimited', gb: 0, days: 3, price: 9.90, vStart: 'first', hotspot: true, topup: true, countries: APAC.slice(), tiers: clone(DEFAULT_TIERS) },
  { id: 2, name: 'APAC Day Pass 1 GB', vendor: 'rombty', apn: 'internet', operator: 'Multi - Networks', region: 'Asia-Pacific', type: 'daypass', gb: 1, days: 7, price: 12.50, vStart: 'first', hotspot: true, topup: true, countries: APAC.slice(), tiers: clone(DEFAULT_TIERS) },
  { id: 3, name: 'APAC 10 GB 30 Days', vendor: 'telco', apn: 'plus', operator: 'Multi - Networks', region: 'Asia-Pacific', type: 'fixed', gb: 10, days: 30, price: 14.90, vStart: 'first', hotspot: true, topup: true, countries: APAC.slice(), tiers: clone(DEFAULT_TIERS) }
];

/* "website database" — kept in this browser so edits survive a refresh */
let PLANS = load();
function load() { try { const p = JSON.parse(localStorage.getItem('pm_plans') || 'null'); if (Array.isArray(p) && p.length) return p; } catch (e) {} return clone(SAMPLE); }
function persist() { try { localStorage.setItem('pm_plans', JSON.stringify(PLANS)); } catch (e) {} }

let editId = PLANS[0].id;      // plan open in the admin
let viewId = PLANS[0].id;      // plan open on the website
let draft = clone(PLANS[0]);   // unsaved admin edits
let flashId = null;

/* ================= GENERATOR (same as Additional Information page) ================= */
function dataLine(p) {
  if (p.type === 'unlimited') return 'Unlimited High speed data';
  if (p.type === 'daypass') return `${fmtGb(p.gb)} High speed data per day`;
  return `${fmtGb(p.gb)} High speed data`;
}
function fmtGb(gb) { gb = +gb || 0; return gb < 1 ? Math.round(gb * 1024) + ' MB' : (Math.round(gb * 10) / 10) + ' GB'; }
function tiersText(p) {
  let from = 0;
  return 'Daily speed: ' + p.tiers.map(t => { const s = `${from}–${t.upTo}% at ${t.mbps} Mbps`; from = t.upTo; return s; }).join(', ');
}
function generateAdditionalInfo(p) {
  const tpl = VENDORS[p.vendor].template;
  const countries = [...p.countries].sort((a, b) => a.localeCompare(b));
  const vars = {
    data: dataLine(p), speedTiers: tiersText(p),
    network: (p.operator || '').replace(/\s*-\s*/g, ' ').replace(/^multi networks?$/i, 'Multi network') || 'Multi network',
    validity: p.days + (+p.days === 1 ? ' day' : ' days'),
    validityStart: p.vStart === 'install' ? 'from eSIM installation' : 'from first network connection',
    apn: p.apn, countries: countries.join(', '), countryCount: countries.length
  };
  const flags = { hotspot: p.hotspot, topup: p.topup, daypass: p.type === 'daypass' };
  const sections = []; let cur = null;
  tpl.split('\n').forEach(raw => {
    let line = raw.trim(); if (!line) return;
    const c = line.match(/^\[(\w+)\]\s*/); if (c) { if (!flags[c[1]]) return; line = line.slice(c[0].length); }
    const fill = l => l.replace(/\{\{(\w+)\}\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m);
    if (line.startsWith('#')) { cur = { title: fill(line.replace(/^#+\s*/, '')), items: [] }; sections.push(cur); return; }
    if (!cur) { cur = { title: '', items: [] }; sections.push(cur); }
    cur.items.push(fill(line.replace(/^[-*•]\s*/, '')));
  });
  return sections.map(s => (s.title ? `<p>${esc(s.title)}</p>` : '') + `<ul>${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join('');
}

/* ================= ADMIN UI ================= */
function fillForm() {
  const p = draft;
  $('name').value = p.name; $('vendor').value = p.vendor; $('apn').value = p.apn; $('operator').value = p.operator;
  $('region').value = p.region; $('gb').value = p.gb; $('days').value = p.days; $('price').value = p.price; $('vStart').value = p.vStart;
  paintSegs(); renderChips(); renderTiers(); renderAdminAI(); paintList(); paintDirty();
}
function paintSegs() {
  document.querySelectorAll('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === draft.type));
  document.querySelectorAll('#hsSeg button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === draft.hotspot));
  document.querySelectorAll('#tuSeg button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === draft.topup));
  $('gbWrap').hidden = draft.type === 'unlimited';
  $('gbLabel').textContent = draft.type === 'daypass' ? 'Data per day (GB)' : 'Data (GB)';
  $('tiersBox').hidden = draft.type !== 'daypass';
  $('apnHint').textContent = `· ${VENDORS[draft.vendor].name} default: ${VENDORS[draft.vendor].apn}`;
}
function paintList() {
  $('plist').innerHTML = PLANS.map(p => `<button type="button" class="pbtn ${p.id === editId ? 'on' : ''}" data-id="${p.id}">${esc(p.name)}<small>${VENDORS[p.vendor].name} · ${p.type === 'daypass' ? 'Day Pass' : p.type === 'unlimited' ? 'Unlimited' : fmtGb(p.gb)}</small></button>`).join('')
    + `<button type="button" class="pbtn new" id="newPlan">+ New plan</button>`;
  $('plist').querySelectorAll('.pbtn[data-id]').forEach(b => b.onclick = () => openPlan(+b.dataset.id));
  $('newPlan').onclick = () => {
    const id = Math.max(...PLANS.map(p => p.id)) + 1;
    PLANS.push({ ...clone(SAMPLE[0]), id, name: 'New plan', countries: [] }); persist(); openPlan(id); renderSite();
  };
}
function openPlan(id) { editId = id; viewId = id; draft = clone(PLANS.find(p => p.id === id)); fillForm(); if ($('cards').childElementCount) renderSite(); }
function renderChips() {
  $('chips').innerHTML = draft.countries.length ? [...draft.countries].sort().map(c => `<span class="chip">${esc(c)}<button type="button" aria-label="Remove ${esc(c)}" data-c="${esc(c)}">×</button></span>`).join('') : '<span style="color:var(--muted);font-size:12px">No countries</span>';
  $('chips').querySelectorAll('button').forEach(b => b.onclick = () => { draft.countries = draft.countries.filter(c => c !== b.dataset.c); changed(); renderChips(); });
}
function renderTiers() {
  let from = 0;
  $('tierRows').innerHTML = draft.tiers.map((t, i) => {
    const row = `<div class="trow"><span class="sw" style="background:${TIER_COLORS[i]}"></span><span>${from}% to</span>
      <input type="number" min="1" max="100" value="${t.upTo}" data-i="${i}" data-k="upTo" aria-label="Step ${i + 1} up to percent" ${i === draft.tiers.length - 1 ? 'readonly' : ''}>
      <span>% → speed</span><span style="display:flex;gap:4px;align-items:center"><input type="number" min="0.1" step="0.1" value="${t.mbps}" data-i="${i}" data-k="mbps" aria-label="Step ${i + 1} Mbps" style="width:60px"> Mbps</span></div>`;
    from = t.upTo; return row;
  }).join('');
  $('tierRows').querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const i = +inp.dataset.i, k = inp.dataset.k;
    let v = +inp.value;
    if (k === 'upTo') { const lo = i ? draft.tiers[i - 1].upTo + 1 : 1, hi = draft.tiers[i + 1].upTo - 1; v = Math.min(hi, Math.max(lo, Math.round(v) || lo)); }
    else v = Math.max(0.1, v || 0.1);
    draft.tiers[i][k] = v; renderTiers(); changed();
  });
}
function renderAdminAI() { $('aiAdmin').innerHTML = generateAdditionalInfo(draft); }
function isDirty() { return JSON.stringify(draft) !== JSON.stringify(PLANS.find(p => p.id === editId)); }
function paintDirty() { $('dirty').innerHTML = isDirty() ? '<span class="dirty">● Unsaved. The website still shows the old version.</span>' : '<span class="saved">✓ Website is up to date</span>'; }
function changed() { renderAdminAI(); paintDirty(); }

// inputs
const bind = (id, key, num) => $(id).addEventListener('input', () => { draft[key] = num ? +$(id).value : $(id).value; changed(); });
bind('name', 'name'); bind('apn', 'apn'); bind('operator', 'operator'); bind('gb', 'gb', true); bind('days', 'days', true); bind('price', 'price', true);
$('region').onchange = () => { draft.region = $('region').value; changed(); };
$('vStart').onchange = () => { draft.vStart = $('vStart').value; changed(); };
$('vendor').onchange = () => {
  const prevDefault = VENDORS[draft.vendor].apn;
  draft.vendor = $('vendor').value;
  // switch the APN to the new vendor's default unless someone typed a custom one
  if (!draft.apn || draft.apn === prevDefault) { draft.apn = VENDORS[draft.vendor].apn; $('apn').value = draft.apn; }
  paintSegs(); changed();
};
document.querySelectorAll('#typeSeg button').forEach(b => b.onclick = () => { draft.type = b.dataset.t; if (draft.type !== 'unlimited' && !draft.gb) { draft.gb = 1; $('gb').value = 1; } paintSegs(); changed(); });
document.querySelectorAll('#hsSeg button').forEach(b => b.onclick = () => { draft.hotspot = b.dataset.v === '1'; paintSegs(); changed(); });
document.querySelectorAll('#tuSeg button').forEach(b => b.onclick = () => { draft.topup = b.dataset.v === '1'; paintSegs(); changed(); });
$('tierReset').onclick = () => { draft.tiers = clone(DEFAULT_TIERS); renderTiers(); changed(); };

// countries
$('cList').innerHTML = ALL.map(c => `<option value="${esc(c)}">`).join('');
$('cPreset').innerHTML += Object.keys(SETS).map(k => `<option>${esc(k)}</option>`).join('');
const addC = t => { t.split(/[,\n;]+/).map(x => x.trim()).filter(Boolean).forEach(c => { const m = ALL.find(a => a.toLowerCase() === c.toLowerCase()) || c; if (!draft.countries.some(x => x.toLowerCase() === m.toLowerCase())) draft.countries.push(m); }); renderChips(); changed(); };
$('cInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addC($('cInput').value); $('cInput').value = ''; } });
$('cInput').addEventListener('change', () => { if (ALL.includes($('cInput').value)) { addC($('cInput').value); $('cInput').value = ''; } });
$('cInput').addEventListener('paste', e => { const t = e.clipboardData.getData('text'); if (/[,\n]/.test(t)) { e.preventDefault(); addC(t); } });
$('cPreset').onchange = () => { if ($('cPreset').value) { draft.countries = SETS[$('cPreset').value].slice(); $('cPreset').value = ''; renderChips(); changed(); } };

// actions
$('save').onclick = () => {
  if (!draft.name.trim()) { toast('Plan name is required'); return; }
  if (!draft.countries.length) { toast('Add at least one country'); return; }
  const i = PLANS.findIndex(p => p.id === editId);
  PLANS[i] = clone(draft); persist();
  viewId = editId; flashId = editId;
  paintList(); paintDirty(); renderSite();
  toast('Saved. The website now shows the update');
};
$('dup').onclick = () => { const id = Math.max(...PLANS.map(p => p.id)) + 1; PLANS.push({ ...clone(draft), id, name: draft.name + ' (copy)' }); persist(); openPlan(id); renderSite(); };
$('del').onclick = () => {
  if (PLANS.length === 1) { toast('Keep at least one plan'); return; }
  PLANS = PLANS.filter(p => p.id !== editId); persist();
  if (viewId === editId) viewId = PLANS[0].id;
  openPlan(PLANS[0].id); renderSite(); toast('Plan deleted');
};

/* ================= WEBSITE ================= */
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function renderSite() {
  const region = (PLANS.find(p => p.id === viewId) || PLANS[0]).region;
  $('sTitle').textContent = `${region} eSIM`;
  $('sSub').textContent = `${PLANS.length} plans`;
  $('cards').innerHTML = PLANS.map(p => {
    const big = p.type === 'unlimited' ? 'Unlimited' : fmtGb(p.gb).replace(/ (GB|MB)/, '<small> $1</small>');
    return `<button type="button" class="pc ${p.id === viewId ? 'sel' : ''} ${p.id === flashId ? 'flash' : ''}" data-id="${p.id}">
      <span class="pill">@ ${esc((p.operator || 'Multi - Networks').toUpperCase())}</span>
      <span class="nm">${esc(p.name)}</span>
      <span class="gb">${big}${p.type === 'daypass' ? '<small> / day</small>' : ''}</span>
      <span class="days">${p.days} ${+p.days === 1 ? 'day' : 'days'}</span>
      ${p.type === 'daypass' ? '<span class="dp">DAY PASS · speed steps</span>' : ''}
      <span class="price">$ ${(+p.price).toFixed(2)}<small>USD</small></span>
      <span class="vd">View Details ↗</span></button>`;
  }).join('');
  $('cards').querySelectorAll('.pc').forEach(c => c.onclick = () => { viewId = +c.dataset.id; flashId = null; renderSite(); });
  flashId = null;
  renderDetail();
}
function renderDetail() {
  const p = PLANS.find(x => x.id === viewId) || PLANS[0];
  $('url').textContent = `yourstore.com/esim/${slug(p.region)}/${slug(p.name)}`;
  const facts = [
    ['Data', p.type === 'unlimited' ? 'Unlimited' : fmtGb(p.gb) + (p.type === 'daypass' ? ' per day' : '')],
    ['Validity', `${p.days} ${+p.days === 1 ? 'day' : 'days'}`],
    ['Network', (p.operator || '').replace(/\s*-\s*/g, ' ')],
    ['APN', p.apn],
    ['Countries', p.countries.length]
  ];
  let speedHtml = '';
  if (p.type === 'daypass') {
    let from = 0;
    const segs = p.tiers.map((t, i) => { const w = t.upTo - from; const h = `<div style="width:${w}%;background:${TIER_COLORS[i]}">${t.mbps} Mbps</div>`; from = t.upTo; return h; }).join('');
    const ticks = [0, ...p.tiers.map(t => t.upTo)].map(v => `<span style="left:${v}%">${v}%</span>`).join('');
    from = 0;
    const daily = (+p.gb || 0) * 1024;
    const legend = p.tiers.map((t, i) => {
      const mbFrom = Math.round(daily * from / 100), mbTo = Math.round(daily * t.upTo / 100);
      const out = `<div style="border-left:4px solid ${TIER_COLORS[i]}"><b>${t.mbps} Mbps</b>${from}–${t.upTo}% of daily data<br><span style="color:var(--muted)">${fmtMb(mbFrom)} – ${fmtMb(mbTo)} each day</span></div>`;
      from = t.upTo; return out;
    }).join('');
    speedHtml = `<div class="speed"><h4>Your daily speed</h4>
      <span class="note">You get ${fmtGb(p.gb)} every day. Speed steps down as you use it, and full speed comes back the next day.</span>
      <div class="sbar" role="img" aria-label="${esc(tiersText(p))}">${segs}</div><div class="sticks">${ticks}</div>
      <div class="slegend">${legend}</div></div>`;
  }
  $('detail').innerHTML = `
    <div class="dhead"><div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.region)} · ${p.countries.length} countries</div></div>
      <div><div class="pr">$ ${(+p.price).toFixed(2)} <small>USD</small></div><button type="button" class="buy">Buy now</button></div></div>
    <div class="facts">${facts.map(f => `<span class="fact">${f[0]}: <b>${esc(f[1])}</b></span>`).join('')}</div>
    ${speedHtml}
    <div class="info">${generateAdditionalInfo(p)}</div>`;
}
function fmtMb(mb) { return mb >= 1024 ? (Math.round(mb / 102.4) / 10) + ' GB' : mb + ' MB'; }

function toast(m) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 2000); }

fillForm();
renderSite();
})();
</script>
</body>
</html>
